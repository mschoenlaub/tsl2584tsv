[package]
name = "tsl2584tsv"
version = "0.1.0"
edition = "2024"
# Tested in CI (.github/workflows/ci.yml, job `msrv`).
rust-version = "1.87"
description = "no_std embedded-hal 1.0 driver for the ams TSL2584TSV ambient light sensor (light-to-digital converter)"
license = "MIT OR Apache-2.0"
authors = ["Manuel Schönlaub"]
repository = "https://github.com/mschoenlaub/tsl2584tsv"
readme = "README.md"
keywords = ["embedded-hal-driver", "no-std", "sensor", "light", "tsl2584"]
categories = ["embedded", "no-std", "hardware-support"]
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
# The `embedded-hal-async` driver, `asynch::Tsl2584tsvAsync`, for executors such as embassy. Off
# by default: the blocking driver needs nothing of it, so nothing of it is built unless a caller
# asks.
async = ["dep:embedded-hal-async"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = { version = "1.0", optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1", "embedded-hal-async"] }
embassy-futures = "0.1"
# Self dev-dependency with `async` on, so that a plain `cargo test` also runs the async driver's
# mock tests. Path-only dev-dependencies are dropped from the published manifest.
tsl2584tsv = { path = ".", features = ["async"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
